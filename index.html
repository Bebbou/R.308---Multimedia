<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Train des Époques</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Scène au format 16:9 : vue fixe depuis l'allée du wagon -->
  <main class="scene">

    <!-- Décor : paysage et wagons. C'est ce bloc qui tremble et qui zoome vers la porte,
         jamais le paysage lui-même (sinon le ciel peut clignoter sur certaines cartes graphiques). -->
    <div class="decor">
      <!-- Paysage commun, visible à travers les fenêtres.
           Ciel fixe, puis trois couches qui défilent de plus en plus vite (parallaxe).
           Chaque côté défile dans son sens. -->
      <div class="paysage" aria-hidden="true">
        <div class="paysage__cote paysage__cote--gauche">
          <div class="paysage__bande paysage__bande--loin"></div>
          <div class="paysage__bande paysage__bande--milieu"></div>
          <div class="paysage__bande paysage__bande--proche"></div>
        </div>
        <div class="paysage__cote paysage__cote--droite">
          <div class="paysage__bande paysage__bande--loin"></div>
          <div class="paysage__bande paysage__bande--milieu"></div>
          <div class="paysage__bande paysage__bande--proche"></div>
        </div>
      </div>

      <!-- Wagons : calques empilés de l'arrière vers l'avant, un seul wagon visible à la fois -->
      <!-- Wagon 01 : un TER d'aujourd'hui (inspiré des trains liO), les élèves tous tournés vers le spectateur.
           On est debout au milieu de la voiture : dans cette moitié, les sièges regardent vers nous.
           Chaque rangée de sièges est un calque séparé (banc-01 au fond, banc-02 au milieu, banc-03 devant) :
           les voyageurs d'une rangée se placent juste après le calque de leurs sièges.
           Pensées provisoires (Lorem ipsum) en attendant les vraies. -->
      <section class="wagon" data-titre="Lorem ipsum" data-ambiance="led" data-son="assets/sons/ambiance-wagon-01.wav">
        <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-01/interieur.png" alt="Intérieur d'un TER moderne : grandes fenêtres, sièges bleus à appuie-tête rouges tournés vers le spectateur">
        <img class="wagon__calque" src="assets/images/wagon-01/banc-01.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-01/banc-02.png" alt="">
        <!-- Rangée du milieu -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/lino.png" alt="Lino, assis dans son siège (personnage provisoire)" data-nom="Lino" data-pensee="Le paquet de chips coûte 3,20 €.... L'arnaque">
        <!-- Joachim : sprite dessiné par Lino, posé tel quel (sans retouche ni mise à l'échelle) -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-02.png" alt="Joachim, assis dans son siège, un livre bleu sur les genoux" data-nom="Joachim" data-pensee="hee-hee">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-03.png" alt="Inas, longs cheveux noirs, lunettes et pull blanc, assise dans son siège" data-nom="Inas" data-pensee="Le contrôleur arrive et mon billet est au fond de mon sac. Ou chez moi.">
        <!-- Erine : sprite dessiné par Inas, posé tel quel. Elle ne parle qu'en PHP (bulle de code) -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-04.png" alt="Erine, longs cheveux bruns, pull bleu marine, assise dans son siège" data-nom="Erine" data-langage="php" data-pensee="<?php echo &quot; le PHP c'est trop biiiennn &quot;; ?>">
        <img class="wagon__calque" src="assets/images/wagon-01/banc-03.png" alt="">
        <!-- Rangée de devant, coupée par le bas de l'écran -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-05.png" alt="Thomas, assis dans son siège (personnage provisoire)" data-nom="Max" data-pensee="Si je m'endors maintenant, je me réveille au terminus. Encore.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-06.png" alt="Raphaël, chapeau haut-de-forme et sweat orange, assis dans son siège" data-nom="Raphaël" data-pensee="Mon chien Cheddar me manque">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-07.png" alt="Nicolas, assis dans son siège (personnage provisoire)" data-nom="Kévin" data-pensee="Le monsieur derrière est au téléphone en haut-parleur. Je connais toute sa vie maintenant.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-08.png" alt="Julien, assis dans son siège (personnage provisoire)" data-nom="Julien" data-pensee="Dix minutes de retard. Donc on est en avance sur le train d'hier.">
      </section>

      <!-- Wagon 02 : voiture-salon de 1re classe d'un train à vapeur (vers 1900).
           Trois copies de la fumée, décalées dans le temps par main.js, pour un défilement continu.
           Les lueurs des lampes sont posées sur l'intérieur, sous les voyageurs. -->
      <section class="wagon" data-titre="Le Salon à vapeur" data-ambiance="gaz" data-son="assets/sons/ambiance-wagon-02.wav">
        <img class="wagon__calque wagon__fumee" src="assets/images/wagon-02/fumee.png" alt="">
        <img class="wagon__calque wagon__fumee" src="assets/images/wagon-02/fumee.png" alt="">
        <img class="wagon__calque wagon__fumee" src="assets/images/wagon-02/fumee.png" alt="">
        <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-02/interieur.png" alt="Voiture-salon de luxe d'un train à vapeur : boiseries d'acajou, fauteuils de velours rouge, lampes à gaz">
        <img class="wagon__calque wagon__lueur" src="assets/images/wagon-02/lueurs.png" alt="">
        <!-- Les professeurs, en tenues de 1900, dans des fauteuils pivotants tournés vers le spectateur.
             Pensées provisoires (Lorem ipsum) en attendant les vraies. -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-01.png" alt="Mr Blanco, chapeau melon et noeud papillon rouge, dans un fauteuil de velours" data-nom="M. Jacques" data-pensee="Pourvu qu'aucun élève ne monte dans ce wagon. Je suis en vacances, en 1900.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-02.png" alt="Mr Bernard, haut-de-forme et monocle, un journal sur les genoux" data-nom="M. Gérard" data-pensee="Ce journal dit que le train est l'avenir. Il a déjà une heure de retard.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-03.png" alt="Mme De velder, grand chapeau à plume et robe turquoise" data-nom="Mme De Montgolfier" data-pensee="Cette plume me chatouille le nez depuis Lyon. Je n'éternuerai pas. Pas en première classe.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-04.png" alt="Mme Pitot, chignon et robe violette à col montant" data-nom="Mme Ginette" data-pensee="Trois jours de voyage et pas de wagon-restaurant ! Qui a organisé ce trajet ?">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-05.png" alt="Mr Gassin, canotier de paille et veste bleu marine, au premier plan" data-nom="M. Gontran" data-pensee="Mon canotier a failli s'envoler au dernier tunnel. Personne n'a rien vu.">
        <!-- Lilian (sprite dessiné à la main), debout à côté du guéridon de droite. Pensée provisoire. -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-06.png" alt="Lilian, debout en costume trois-pièces bleu, à côté du guéridon" data-nom="M. Lilian Cornet" data-pensee="Je ne sais pas comment je suis arrivé en 1900, mais ce costume me va très bien.">
      </section>

      <section class="wagon" data-titre="Consectetur" data-son="assets/sons/ambiance-wagon-03.wav">
        <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-03/interieur.png" alt="Intérieur du wagon, banquettes le long des parois">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-01.png" alt="Voyageur assis" data-nom="Alice" data-pensee="Mon walkman n'a plus de piles et il reste quatre heures de trajet.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-02.png" alt="Voyageur assis" data-nom="Léon" data-pensee="On est à Vierzon. Depuis vingt minutes. On est toujours à Vierzon.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-03.png" alt="Voyageur assis" data-nom="Nana" data-pensee="Le sandwich : 25 francs. Le jambon dedans : introuvable.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-04.png" alt="Voyageur assis" data-nom="Tom" data-pensee="Si je fais semblant de dormir, personne ne me demandera ma place côté fenêtre.">
        <!-- Blanco (sprite dessiné à la main), assis à l'envers sur un siège de droite, tourné vers le spectateur. Son sprite est coupé au haut du dossier (y 242), car le dossier fait partie de l'intérieur. -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-05.png" alt="Blanco, assis à l'envers sur son siège, tourné vers le spectateur, veste noire" data-nom="Blanco" data-pensee="CUUUUUUUUUUTTT">
      </section>

      <section class="wagon" data-titre="Adipiscing elit" data-son="assets/sons/ambiance-wagon-04.wav">
        <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-04/interieur.png" alt="Intérieur du wagon, banquettes le long des parois">
        <!-- Liku (sprite dessiné à la main), debout au fond de l'allée, devant la porte. -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-05.png" alt="Liku, debout au fond de l'allée, chemise hawaïenne rouge à fleurs et short beige" data-nom="Liku" data-pensee="Mālō, 'e ke 'alu kifea ?">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-01.png" alt="Voyageur assis" data-nom="Zoé" data-pensee="Le train file à 900 km/h et il a quand même cinq minutes de retard.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-02.png" alt="Voyageur assis" data-nom="Sam" data-pensee="Mon implant me rappelle que j'ai oublié d'éteindre le four. Le futur ne change rien.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-03.png" alt="Voyageur assis" data-nom="Jeanne" data-pensee="Le robot contrôleur m'a demandé mon billet trois fois. Je crois qu'il m'aime bien.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-04.png" alt="Voyageur assis" data-nom="Noé" data-pensee="Téléportation en panne, alors on reprend le train comme nos ancêtres. Quelle horreur.">
      </section>
    </div>

    <!-- Lumière d'ambiance posée sur toute la scène (léger scintillement) -->
    <div class="lumiere" aria-hidden="true"></div>

    <!-- Bulle de pensée : une seule pour toute la scène, placée par main.js au-dessus du personnage -->
    <div class="pensee" aria-live="polite">
      <p class="pensee__nom"></p>
      <p class="pensee__texte"></p>
    </div>

    <!-- Survol de la porte du fond : cadre lumineux autour de l'ouverture et étiquette -->
    <div class="cadre-porte" aria-hidden="true"></div>
    <p class="etiquette-porte" aria-hidden="true"></p>

    <!-- Écran noir utilisé pour les fondus entre deux wagons -->
    <div class="fondu" aria-hidden="true"></div>

    <!-- Carton titre affiché quelques instants à l'arrivée dans un wagon -->
    <div class="carton" aria-hidden="true">
      <p class="carton__numero"></p>
      <p class="carton__titre"></p>
    </div>

  </main>

  <!-- Interface : indicateur du wagon courant et boutons Arrière / Suivant.
       Le petit train est rempli par main.js (un wagon dessiné par section.wagon). -->
  <p class="indicateur" aria-live="polite">
    <span class="indicateur__train" aria-hidden="true"></span>
    <span class="indicateur__numero"></span>
    <span class="indicateur__nom"></span>
  </p>

  <button class="bouton bouton-arriere" type="button">Arrière</button>
  <!-- Même action que la porte du fond, pour ceux qui ne pensent pas à cliquer dessus -->
  <button class="bouton bouton-avant" type="button">Suivant</button>
  <!-- Coupe ou remet le son (aussi avec la touche M) -->
  <button class="bouton bouton-son" type="button" aria-pressed="true">Son : oui</button>

  <!-- Écran d'accueil : titre et consignes sur toute la fenêtre, disparaît à la première action -->
  <div class="accueil">
    <div class="accueil__contenu">
      <h1 class="accueil__titre">Le Train des Époques</h1>
      <ul class="accueil__consignes">
        <li><span class="accueil__geste">Survoler ou toucher un voyageur</span> lire sa pensée</li>
        <li><span class="accueil__geste">Porte du fond ou bouton Suivant</span> wagon suivant</li>
        <li><span class="accueil__geste">Flèches, molette ou glisser</span> se déplacer</li>
        <li><span class="accueil__geste">Bouton Son ou touche M</span> couper le son</li>
      </ul>
      <button class="accueil__bouton" type="button">Monter à bord</button>
      <p class="accueil__invite">ou appuie n'importe où</p>
    </div>
  </div>

  <!-- GSAP : moteur d'animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Plugin Observer : écoute molette, tactile et pointeur -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>
  <!-- Howler : gestion du son (activé plus tard) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <!-- Notre script, toujours en dernier -->
  <script src="js/main.js"></script>
</body>
</html>
