<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Train des Époques</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Scène au format 16:9 : vue fixe depuis l'allée du wagon -->
  <main class="scene">

    <!-- Paysage commun, visible à travers les fenêtres. Chaque côté défile dans son sens. -->
    <div class="paysage" aria-hidden="true">
      <div class="paysage__cote paysage__cote--gauche">
        <div class="paysage__bande"></div>
      </div>
      <div class="paysage__cote paysage__cote--droite">
        <div class="paysage__bande"></div>
      </div>
    </div>

    <!-- Wagons : calques empilés de l'arrière vers l'avant, un seul wagon visible à la fois -->
    <section class="wagon" data-titre="Lorem ipsum">
      <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
      <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
      <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
      <img class="wagon__calque" src="assets/images/wagon-01/interieur.png" alt="Intérieur du wagon, banquettes le long des parois">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-01.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-02.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-03.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-04.png" alt="Voyageur assis" data-pensee="">
    </section>

    <section class="wagon" data-titre="Dolor sit amet">
      <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
      <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
      <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
      <img class="wagon__calque" src="assets/images/wagon-02/interieur.png" alt="Intérieur du wagon, banquettes le long des parois">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-01.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-02.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-03.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-04.png" alt="Voyageur assis" data-pensee="">
    </section>

    <section class="wagon" data-titre="Consectetur">
      <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
      <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
      <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
      <img class="wagon__calque" src="assets/images/wagon-03/interieur.png" alt="Intérieur du wagon, banquettes le long des parois">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-01.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-02.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-03.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-04.png" alt="Voyageur assis" data-pensee="">
    </section>

    <section class="wagon" data-titre="Adipiscing elit">
      <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
      <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
      <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
      <img class="wagon__calque" src="assets/images/wagon-04/interieur.png" alt="Intérieur du wagon, banquettes le long des parois">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-01.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-02.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-03.png" alt="Voyageur assis" data-pensee="">
      <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-04.png" alt="Voyageur assis" data-pensee="">
    </section>

    <!-- Lumière d'ambiance posée sur toute la scène (léger scintillement) -->
    <div class="lumiere" aria-hidden="true"></div>

    <!-- Écran noir utilisé pour les fondus entre deux wagons -->
    <div class="fondu" aria-hidden="true"></div>

  </main>

  <!-- Interface : indicateur du wagon courant et bouton de retour -->
  <p class="indicateur" aria-live="polite">
    <span class="indicateur__numero"></span>
    <span class="indicateur__nom"></span>
  </p>

  <button class="bouton-arriere" type="button">Arrière</button>

  <!-- GSAP : moteur d'animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Plugin Observer : écoute molette, tactile et pointeur -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>
  <!-- Howler : gestion du son (activé plus tard) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <!-- Notre script, toujours en dernier -->
  <script src="js/main.js"></script>
</body>
</html>
