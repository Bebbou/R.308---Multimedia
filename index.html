<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Train des Époques</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Scène au format 16:9 : vue fixe depuis l'allée du wagon -->
  <main class="scene">

    <!-- Décor : paysage et wagons. C'est ce bloc qui tremble et qui zoome vers la porte,
         jamais le paysage lui-même (sinon le ciel peut clignoter sur certaines cartes graphiques). -->
    <div class="decor">
      <!-- Paysage commun, visible à travers les fenêtres.
           Ciel fixe, puis trois couches qui défilent de plus en plus vite (parallaxe).
           Chaque côté défile dans son sens. -->
      <div class="paysage" aria-hidden="true">
        <div class="paysage__cote paysage__cote--gauche">
          <div class="paysage__bande paysage__bande--loin"></div>
          <div class="paysage__bande paysage__bande--milieu"></div>
          <div class="paysage__bande paysage__bande--proche"></div>
        </div>
        <div class="paysage__cote paysage__cote--droite">
          <div class="paysage__bande paysage__bande--loin"></div>
          <div class="paysage__bande paysage__bande--milieu"></div>
          <div class="paysage__bande paysage__bande--proche"></div>
        </div>
      </div>

      <!-- Wagons : calques empilés de l'arrière vers l'avant, un seul wagon visible à la fois -->
      <!-- Wagon 01 : les élèves, tous tournés vers le spectateur.
           Les bancs sont des calques séparés (banc-01 au fond, banc-02 au milieu, banc-03 devant) :
           les voyageurs d'une rangée se placent juste après le calque de leur banc.
           Pensées provisoires (Lorem ipsum) en attendant les vraies. -->
      <section class="wagon" data-titre="Lorem ipsum">
        <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-01/interieur.png" alt="Intérieur d'une voiture en bois, banquettes tournées vers le spectateur">
        <img class="wagon__calque" src="assets/images/wagon-01/banc-01.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-01/banc-02.png" alt="">
        <!-- Rangée du milieu -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-01.png" alt="Lino, assis sur la banquette (personnage provisoire)" data-nom="Lino" data-pensee="Lorem ipsum dolor sit amet, consectetur adipiscing elit.">
        <!-- Joaquim : sprite dessiné par Lino, posé tel quel (sans retouche ni mise à l'échelle) -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-02.png" alt="Joaquim, assis sur la banquette, un livre bleu sur les genoux" data-nom="Joaquim" data-pensee="Ut enim ad minim veniam, quis nostrud.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-03.png" alt="Inas, assis sur la banquette (personnage provisoire)" data-nom="Inas" data-pensee="Sed do eiusmod tempor incididunt ut labore.">
        <!-- Erine : sprite dessiné par Inas, posé tel quel. Elle ne parle qu'en PHP (bulle de code) -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-04.png" alt="Erine, longs cheveux bruns, pull bleu marine, assise sur la banquette" data-nom="Erine" data-langage="php" data-pensee="<?php echo &quot;Lorem ipsum dolor sit amet&quot;; ?>">
        <img class="wagon__calque" src="assets/images/wagon-01/banc-03.png" alt="">
        <!-- Rangée de devant, coupée par le bas de l'écran -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-05.png" alt="Lilian, assis sur la banquette (personnage provisoire)" data-nom="Lilian" data-pensee="Duis aute irure dolor in reprehenderit.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-06.png" alt="Raphaël, assis sur la banquette (personnage provisoire)" data-nom="Raphaël" data-pensee="Excepteur sint occaecat cupidatat non proident.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-07.png" alt="Liku, assis sur la banquette (personnage provisoire)" data-nom="Liku" data-pensee="Nemo enim ipsam voluptatem quia voluptas sit.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-01/personnage-08.png" alt="Alio, assis sur la banquette (personnage provisoire)" data-nom="Alio" data-pensee="Quis autem vel eum iure reprehenderit.">
      </section>

      <!-- Wagon 02 : voiture-salon de 1re classe d'un train à vapeur (vers 1900).
           Trois copies de la fumée, décalées dans le temps par main.js, pour un défilement continu.
           Les lueurs des lampes sont posées sur l'intérieur, sous les voyageurs. -->
      <section class="wagon" data-titre="Le Salon à vapeur">
        <img class="wagon__calque wagon__fumee" src="assets/images/wagon-02/fumee.png" alt="">
        <img class="wagon__calque wagon__fumee" src="assets/images/wagon-02/fumee.png" alt="">
        <img class="wagon__calque wagon__fumee" src="assets/images/wagon-02/fumee.png" alt="">
        <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-02/interieur.png" alt="Voiture-salon de luxe d'un train à vapeur : boiseries d'acajou, fauteuils de velours rouge, lampes à gaz">
        <img class="wagon__calque wagon__lueur" src="assets/images/wagon-02/lueurs.png" alt="">
        <!-- Les professeurs, en tenues de 1900, dans des fauteuils pivotants tournés vers le spectateur.
             Pensées provisoires (Lorem ipsum) en attendant les vraies. -->
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-01.png" alt="Mr Blanco, chapeau melon et noeud papillon rouge, dans un fauteuil de velours" data-nom="Mr Blanco" data-pensee="Quis autem vel eum iure reprehenderit.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-02.png" alt="Mr Bernard, haut-de-forme et monocle, un journal sur les genoux" data-nom="Mr Bernard" data-pensee="Neque porro quisquam est, qui dolorem ipsum.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-03.png" alt="Mme De velder, grand chapeau à plume et robe turquoise" data-nom="Mme De velder" data-pensee="Excepteur sint occaecat cupidatat non proident.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-04.png" alt="Mme Pitot, chignon et robe violette à col montant" data-nom="Mme Pitot" data-pensee="Nemo enim ipsam voluptatem quia voluptas sit.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-02/personnage-05.png" alt="Mr Gassin, canotier de paille et veste bleu marine, au premier plan" data-nom="Mr Gassin" data-pensee="Ut enim ad minima veniam, quis nostrum.">
      </section>

      <section class="wagon" data-titre="Consectetur">
        <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-03/interieur.png" alt="Intérieur du wagon, banquettes le long des parois">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-01.png" alt="Voyageur assis" data-nom="Alice" data-pensee="At vero eos et accusamus et iusto odio.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-02.png" alt="Voyageur assis" data-nom="Léon" data-pensee="Nam libero tempore, cum soluta nobis est.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-03.png" alt="Voyageur assis" data-nom="Nina" data-pensee="Temporibus autem quibusdam et aut officiis.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-03/personnage-04.png" alt="Voyageur assis" data-nom="Tom" data-pensee="Itaque earum rerum hic tenetur a sapiente.">
      </section>

      <section class="wagon" data-titre="Adipiscing elit">
        <img class="wagon__calque" src="assets/images/commun/passage.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--gauche" src="assets/images/commun/porte-gauche.png" alt="">
        <img class="wagon__calque wagon__porte wagon__porte--droite" src="assets/images/commun/porte-droite.png" alt="">
        <img class="wagon__calque" src="assets/images/wagon-04/interieur.png" alt="Intérieur du wagon, banquettes le long des parois">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-01.png" alt="Voyageur assis" data-nom="Zoé" data-pensee="Similique sunt in culpa qui officia deserunt.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-02.png" alt="Voyageur assis" data-nom="Sam" data-pensee="Et harum quidem rerum facilis est et expedita.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-03.png" alt="Voyageur assis" data-nom="Jeanne" data-pensee="Omnis voluptas assumenda est, omnis dolor.">
        <img class="wagon__calque wagon__personnage" src="assets/images/wagon-04/personnage-04.png" alt="Voyageur assis" data-nom="Noé" data-pensee="Ut aut reiciendis voluptatibus maiores alias.">
      </section>
    </div>

    <!-- Lumière d'ambiance posée sur toute la scène (léger scintillement) -->
    <div class="lumiere" aria-hidden="true"></div>

    <!-- Bulle de pensée : une seule pour toute la scène, placée par main.js au-dessus du personnage -->
    <div class="pensee" aria-live="polite">
      <p class="pensee__nom"></p>
      <p class="pensee__texte"></p>
    </div>

    <!-- Survol de la porte du fond : cadre lumineux autour de l'ouverture et étiquette -->
    <div class="cadre-porte" aria-hidden="true"></div>
    <p class="etiquette-porte" aria-hidden="true"></p>

    <!-- Écran noir utilisé pour les fondus entre deux wagons -->
    <div class="fondu" aria-hidden="true"></div>

    <!-- Carton titre affiché quelques instants à l'arrivée dans un wagon -->
    <div class="carton" aria-hidden="true">
      <p class="carton__numero"></p>
      <p class="carton__titre"></p>
    </div>

  </main>

  <!-- Interface : indicateur du wagon courant et boutons Arrière / Suivant.
       Le petit train est rempli par main.js (un wagon dessiné par section.wagon). -->
  <p class="indicateur" aria-live="polite">
    <span class="indicateur__train" aria-hidden="true"></span>
    <span class="indicateur__numero"></span>
    <span class="indicateur__nom"></span>
  </p>

  <button class="bouton bouton-arriere" type="button">Arrière</button>
  <!-- Même action que la porte du fond, pour ceux qui ne pensent pas à cliquer dessus -->
  <button class="bouton bouton-avant" type="button">Suivant</button>

  <!-- Écran d'accueil : titre et consignes sur toute la fenêtre, disparaît à la première action -->
  <div class="accueil">
    <div class="accueil__contenu">
      <h1 class="accueil__titre">Le Train des Époques</h1>
      <ul class="accueil__consignes">
        <li><span class="accueil__geste">Survoler ou toucher un voyageur</span> lire sa pensée</li>
        <li><span class="accueil__geste">Porte du fond ou bouton Suivant</span> wagon suivant</li>
        <li><span class="accueil__geste">Flèches, molette ou glisser</span> se déplacer</li>
      </ul>
      <button class="accueil__bouton" type="button">Monter à bord</button>
      <p class="accueil__invite">ou appuie n'importe où</p>
    </div>
  </div>

  <!-- GSAP : moteur d'animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Plugin Observer : écoute molette, tactile et pointeur -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>
  <!-- Howler : gestion du son (activé plus tard) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <!-- Notre script, toujours en dernier -->
  <script src="js/main.js"></script>
</body>
</html>
